# Deploy the Starlight documentation to GitHub Pages, served at the domain in `public/CNAME`.
name: Docs

# The whole repository is the site, so every push to `main` is a candidate: there is no source
# tree here that could change without changing what this publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only at the top, so a job added here starts with no write it did not ask for; the deploy
# job below raises exactly the two Pages needs. OpenSSF's least-privilege guidance: a write granted
# workflow-wide is granted to every job, including ones written later.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The version comes from `.nvmrc` rather than a literal here, so this cannot drift from what
      # a contributor's `nvm use` picks.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # `ci`, never `install`: the lockfile is the input, and a resolution that differs from a
      # contributor's is a different site than the one they reviewed.
      - name: Install
        run: npm ci

      # `DOCS_SITE` and `DOCS_BASE` are left unset, so the build takes the custom domain in
      # `astro.config.mjs`. They exist for a preview served from somewhere else, not for this.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
